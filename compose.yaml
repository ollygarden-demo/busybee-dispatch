x-app: &app
  build: .
  environment: &app-environment
    AWS_REGION: eu-central-1
    DATABASE_URL: postgis://postgres:postgres@postgres:5432/busybee_dispatch_development
    EVENT_LEASE_TABLE: busybee-consumed-events
    JWT_SECRET: local-development-secret
    LOCALSTACK_ENDPOINT: http://localstack:4566
    REDIS_URL: redis://redis:6379/0
    ROUTING_URL: http://mock-routing:9292
    SQS_QUEUE_URL: http://localstack:4566/000000000000/busybee-deliveries
    DISPATCH_TOPIC_ARN: arn:aws:sns:eu-central-1:000000000000:busybee-events
    PROOF_BUCKET: busybee-proofs
    OTEL_SERVICE_NAME: busybee-dispatch
    OTEL_SERVICE_VERSION: development
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=development
    OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_PROPAGATORS: tracecontext,baggage
    OTEL_TRACES_EXPORTER: otlp
    OTEL_METRICS_EXPORTER: otlp
    OTEL_METRIC_EXPORT_INTERVAL: "10000"
    OTEL_LOGS_EXPORTER: otlp
    OTEL_TRACES_SAMPLER: parentbased_traceidratio
    OTEL_TRACES_SAMPLER_ARG: "1.0"
    OTEL_LOG_LEVEL: error
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    localstack:
      condition: service_healthy
    mock-routing:
      condition: service_healthy
    lgtm:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "${BUSYBEE_API_PORT:-3000}:3000"

  sidekiq:
    <<: *app
    command: bundle exec sidekiq -C config/sidekiq.yml

  shoryuken:
    <<: *app
    command: bundle exec shoryuken -R -C config/shoryuken.yml

  lgtm:
    image: grafana/otel-lgtm:0.32.0
    healthcheck:
      test: ["CMD", "cat", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "3001:3000"
      - "${BUSYBEE_OTLP_GRPC_PORT:-4317}:4317"
      - "${BUSYBEE_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - lgtm-data:/data

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: busybee_dispatch_development
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d busybee_dispatch_development"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  localstack:
    image: localstack/localstack:4.7
    environment:
      AWS_DEFAULT_REGION: eu-central-1
      SERVICES: cloudwatch,dynamodb,s3,sns,sqs,ssm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro

  mock-routing:
    image: python:3.13-alpine
    command: python /app/mock-routing/app.py
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9292/health"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "9292:9292"
    volumes:
      - .:/app:ro

volumes:
  lgtm-data:
  postgres-data:
